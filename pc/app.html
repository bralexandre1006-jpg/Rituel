<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://firestore.googleapis.com; font-src data:; img-src data:; style-src 'self' 'unsafe-inline'">
<title>Rituel</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-top drag"><span class="brand">Rituel</span></div>
    <div class="side-lbl">Listes</div>
    <nav id="lists"></nav>
    <div class="side-sep"></div>
    <button class="nav" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Paramètres</span></button>
    <div class="side-foot" id="syncFoot"></div>
  </aside>

  <section class="mid" id="mid">
    <div class="mid-head drag">
      <div><h1 id="listTitle">Aujourd'hui</h1><small id="listCount"></small></div>
      <button class="ibtn nodrag" id="newBtn" title="Nouvelle tâche (Ctrl+N)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </div>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Rechercher"></label>
    <div class="items" id="items"></div>
  </section>

  <section class="detail" id="detail"></section>

  <section class="settings" id="settings" hidden></section>

  <div class="wctl nodrag">
    <button data-w="min" title="Réduire"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button data-w="max" title="Agrandir"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    <button data-w="close" title="Fermer"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </div>
</div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="datepick.js"></script>
<script src="app.js"></script>
</body>
</html>
