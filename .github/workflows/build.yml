name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          npm install
          pip install pillow

      - name: Préparer le dossier web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Icône et écran de démarrage Rituel
        run: |
          ICON=$(find . -name 'icon-only.png' -not -path './node_modules/*' -not -path './android/*' | head -n 1)
          if [ -z "$ICON" ]; then
            echo "::error::Fichier icon-only.png introuvable dans le repo."
            exit 1
          fi
          echo "Icône source : $ICON"
          python3 - "$ICON" android/app/src/main/res <<'EOF'
          import os, sys
          from PIL import Image, ImageOps, ImageDraw
          src = Image.open(sys.argv[1]).convert('L')
          logo = src.crop(src.point(lambda p: 255 if p < 128 else 0).getbbox())
          LIGHT = (0, 0, 0); DARK = (0, 0, 0); INK = (255, 255, 255); PAPER = (255, 255, 255)
          OUT = sys.argv[2]
          def layer(px, color):
              w, h = logo.size; s = px / max(w, h)
              l = logo.resize((max(1, int(w*s)), max(1, int(h*s))), Image.LANCZOS)
              a = ImageOps.invert(l).point(lambda p: max(0, min(255, int((p-50)*255/150))))
              L = Image.new('RGBA', l.size, color + (255,)); L.putalpha(a); return L
          def canvas(W, H, bg, frac, color, rgba=False, dx=0):
              c = Image.new('RGBA', (W, H), (bg + (255,)) if bg else (0, 0, 0, 0))
              L = layer(int(min(W, H)*frac), color)
              c.alpha_composite(L, ((W - L.size[0])//2 - int(L.size[0]*dx), (H - L.size[1])//2))
              return c if rgba else c.convert('RGB')
          def save(img, p):
              p = os.path.join(OUT, p); os.makedirs(os.path.dirname(p), exist_ok=True); img.save(p)
          for d, k in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              n = int(48*k)
              save(canvas(n, n, LIGHT, .62, INK), f'mipmap-{d}/ic_launcher.png')
              m = Image.new('L', (n*4, n*4), 0); ImageDraw.Draw(m).ellipse((0, 0, n*4, n*4), fill=255); m = m.resize((n, n), Image.LANCZOS)
              r = canvas(n, n, LIGHT, .55, INK, True); r.putalpha(m); save(r, f'mipmap-{d}/ic_launcher_round.png')
              f = int(108*k)
              save(canvas(f, f, None, .46, INK, True), f'mipmap-{d}/ic_launcher_foreground.png')
              save(canvas(f, f, None, .46, (255, 255, 255), True), f'mipmap-{d}/ic_launcher_monochrome.png')
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '    <background android:drawable="@color/ic_launcher_background"/>\n'
                 '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                 '    <monochrome android:drawable="@mipmap/ic_launcher_monochrome"/>\n'
                 '</adaptive-icon>\n')
          os.makedirs(os.path.join(OUT, 'mipmap-anydpi-v26'), exist_ok=True)
          for nm in ('ic_launcher', 'ic_launcher_round'):
              open(os.path.join(OUT, 'mipmap-anydpi-v26', nm + '.xml'), 'w').write(xml)
          os.makedirs(os.path.join(OUT, 'values'), exist_ok=True)
          open(os.path.join(OUT, 'values', 'ic_launcher_background.xml'), 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')
          for d, (w, h) in {'mdpi': (320, 480), 'hdpi': (480, 800), 'xhdpi': (720, 1280), 'xxhdpi': (960, 1600), 'xxxhdpi': (1280, 1920)}.items():
              save(canvas(w, h, LIGHT, .22, INK, dx=.125), f'drawable-port-{d}/splash.png')
              save(canvas(h, w, LIGHT, .22, INK, dx=.125), f'drawable-land-{d}/splash.png')
              save(canvas(w, h, DARK, .22, PAPER, dx=.125), f'drawable-port-night-{d}/splash.png')
              save(canvas(h, w, DARK, .22, PAPER, dx=.125), f'drawable-land-night-{d}/splash.png')
          save(canvas(480, 320, LIGHT, .22, INK, dx=.125), 'drawable/splash.png')
          save(canvas(480, 320, DARK, .22, PAPER, dx=.125), 'drawable-night/splash.png')
          print('Icône Rituel appliquée')
          EOF

      - name: Réglages Android (rappels exacts, mode sombre forcé désactivé)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#\(<style name="AppTheme[^"]*"[^>]*>\)#\1\n        <item name="android:forceDarkAllowed">false</item>#' android/app/src/main/res/values/styles.xml

      - name: Numéro de version automatique
        run: |
          VC=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode [0-9]*/versionCode $VC/" android/app/build.gradle
          echo "versionCode : $VC"
          sed -i "s/versionName \"[^\"]*\"/versionName \"4.3.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Signature fixe (mises à jour sans désinstaller)
        run: |
          KEY=$(find . -name 'rituel.keystore' -not -path './node_modules/*' -not -path './android/*' | head -n 1)
          if [ -z "$KEY" ]; then
            echo "::error::Fichier rituel.keystore introuvable dans le repo."
            exit 1
          fi
          cp "$KEY" android/app/rituel.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  rituel {
                      storeFile file("rituel.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.rituel }
              }
          }
          GRADLE
          echo "Clé utilisée : $KEY"
          keytool -list -v -keystore android/app/rituel.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | head -n 1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f' > /tmp/key.sha
          echo "Empreinte attendue : $(cat /tmp/key.sha)"

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Vérifier la signature
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n 1)apksigner
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          GOT=$($APKSIGNER verify --print-certs "$APK" | grep 'SHA-256 digest' | head -n 1 | sed 's/.*digest: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Empreinte de l'APK : $GOT"
          if [ "$GOT" != "$(cat /tmp/key.sha)" ]; then
            echo "::error::L'APK n'est pas signé avec rituel.keystore."
            exit 1
          fi
          echo "Signature OK : les mises à jour s'installeront par-dessus."

      - uses: actions/upload-artifact@v4
        with:
          name: Rituel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
